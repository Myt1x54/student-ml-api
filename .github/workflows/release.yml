name: Release

# The release workflow runs ONLY when a semantic-version tag is pushed
# (e.g. v1.0.0, v1.1.0, v2.0.0). Publishing is intentionally NOT done from
# pull requests — only tagged, reviewed-and-merged code becomes a published
# artifact.
on:
  push:
    tags:
      - "v*.*.*"

# GITHUB_TOKEN needs write access to packages to push to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  release:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR image names must be lowercase; the owner "Myt1x54" -> "myt1x54".
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/student-ml-api" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token — no hard-coded credentials in the YAML.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives the version from the git tag automatically:
      #   tag v1.0.0  ->  1.0.0   (semver {{version}})
      # It also produces OCI labels (version, revision/commit, source, created)
      # and a commit-specific tag. Nothing is hard-coded.
      - name: Extract Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha,format=short,prefix=
          labels: |
            org.opencontainers.image.title=student-ml-api
            org.opencontainers.image.description=Minimal ML inference service (MLOps workflow demo)

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show published tags and digest
        run: |
          echo "Published the following tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"
