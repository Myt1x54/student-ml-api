name: CI

# Run CI on every Pull Request targeting main, and also on pushes to
# feature branches so developers get fast feedback before opening a PR.
# CI validates the code and the Docker build, but it must NOT push any
# image to a registry — publishing is the release workflow's job.
on:
  pull_request:
    branches: ["main"]
  push:
    branches:
      - "feature/**"

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  docker-build:
    name: Validate Docker build
    runs-on: ubuntu-latest
    # Only attempt the Docker build if the tests passed.
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (validation only, no push)
        run: docker build -t student-ml-api:ci-${{ github.sha }} .
